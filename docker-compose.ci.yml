# Override used by the CI workflow: adds a Mailpit inbox so that the tests can read the emails.
# docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
services:
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  worker:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      mailpit:
        condition: service_started
