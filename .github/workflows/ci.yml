name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: Build the stack and run the user journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMTP_HOST: mailpit
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Wait for the web app
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/health; then
              echo
              echo "The web app is up after $i attempts"
              exit 0
            fi
            sleep 2
          done
          echo "The web app did not answer in time"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
          exit 1

      - name: Seed the demo account
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api node dist/seed.js

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the test dependencies
        run: npm ci -w tests/e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the user journeys
        run: npm run test:e2e

      - name: Show the stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
